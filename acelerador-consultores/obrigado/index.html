  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Recebemos sua aplicação | Instituto Axon</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/logo.svg">
  <meta name="theme-color" content="#0B0710">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    /* ════════════════════════════════════════════
       DESIGN SYSTEM · Instituto Axon · Acelerador
       Tema escuro cinematográfico · acento rosa Axon
       Títulos: Helvetica Neue · Destaques: Instrument Serif itálico
       Texto: Instrument Sans
    ════════════════════════════════════════════ */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper:      #0A0710;
      --paper-2:    #110B18;
      --surface:    #170F20;
      --surface-2:  #1E1429;
      --ink:        #FBF6F9;
      --ink-2:      #14060D;
      --body-c:     #C2B4BE;
      --faint:      #8E8090;
      --line:       rgba(255,255,255,.08);
      --line-2:     rgba(255,255,255,.16);
      --pink-pale:  rgba(233,32,99,.16);
      --pink-line:  rgba(233,32,99,.32);
      --pink-soft:  rgba(233,32,99,.08);
      --accent:     #E92063;
      --accent-bright:#FF5C92;
      --accent-soft:#FFB3CB;
      --warm:       #FF6738;
      --warm-bg:    rgba(255,103,56,.14);
      --warm-line:  rgba(255,103,56,.34);
      --warm-deep:  #FF9A7A;
      --dark:       #070409;
      --display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --serif:   'Instrument Serif', Georgia, 'Times New Roman', serif;
      --sans:    'Instrument Sans', system-ui, sans-serif;
      --r-card: 22px;
      --shadow-card: 0 1px 2px rgba(0,0,0,.35), 0 24px 60px -30px rgba(0,0,0,.85);
      --ease: cubic-bezier(.2,.6,.2,1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--body-c);
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    ::selection { background: var(--accent); color: #fff; }
    :focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 3px; border-radius: 4px; }

    h1, h2, h3 { color: var(--ink); }
    h1, h2 { font-family: var(--display); font-weight: 700; }

    .em {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 400;
      font-size: 1.08em;
      letter-spacing: -.01em;
      color: var(--accent-bright);
    }

    img { max-width: 100%; display: block; }
    a { color: inherit; }
    picture { display: block; }

    .wrap   { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
    .narrow { max-width: 880px;  margin: 0 auto; padding: 0 24px; }

    /* ── Ícones ── */
    .ico {
      width: 20px; height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .ico--s { width: 14px; height: 14px; stroke-width: 2; }
    .ico--xs { width: 12px; height: 12px; stroke-width: 2.6; }
    .ico--l { width: 24px; height: 24px; stroke-width: 1.6; }

    .tile {
      position: relative;
      width: 48px; height: 48px;
      border-radius: 15px;
      background: linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.13);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 10px 24px -14px rgba(0,0,0,.9);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-bright);
      flex-shrink: 0;
    }
    .tile::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: radial-gradient(circle at 28% 18%, rgba(255,92,146,.3), transparent 62%);
      pointer-events: none;
    }
    .tile--warm { color: var(--warm); }
    .tile--warm::after { background: radial-gradient(circle at 28% 18%, rgba(255,103,56,.32), transparent 62%); }
    .tile--sm { width: 40px; height: 40px; border-radius: 12px; }

    /* ── Fundo ── */
    .has-grid { position: relative; }
    .has-grid::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
      background-size: 56px 56px;
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 20%, transparent 80%);
      mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 20%, transparent 80%);
      pointer-events: none;
    }
    .has-glow { overflow: hidden; }
    .has-glow::after {
      content: '';
      position: absolute;
      width: 720px; height: 720px;
      top: -260px; right: -220px;
      background: radial-gradient(circle, rgba(233,32,99,.16), transparent 62%);
      pointer-events: none;
    }
    .has-glow.glow-left::after { right: auto; left: -260px; top: auto; bottom: -260px; }
    section > .wrap, section > .narrow { position: relative; z-index: 1; }

    /* ── Reveal ── */
    .rv { opacity: 0; transform: translateY(18px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
    .rv.in { opacity: 1; transform: none; }
    .d1 { transition-delay: .08s; } .d2 { transition-delay: .16s; }
    .d3 { transition-delay: .24s; } .d4 { transition-delay: .32s; }
    @media (prefers-reduced-motion: reduce) {
      .rv { opacity: 1; transform: none; transition: none; }
    }

    /* ── Chip ── */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--pink-pale);
      border: 1px solid var(--pink-line);
      color: var(--accent-bright);
      border-radius: 999px;
      padding: 7px 14px 7px 10px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      line-height: 1.3;
    }
    .chip .ico { width: 14px; height: 14px; stroke-width: 2; }
    .chip--warm { background: var(--warm-bg); border-color: var(--warm-line); color: var(--warm-deep); }
    .chip--ghost { background: rgba(255,255,255,.05); border-color: var(--line-2); color: #EFE4EA; }

    /* ── Botões ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--accent);
      color: #fff;
      font-family: var(--sans);
      font-size: 15.5px;
      font-weight: 600;
      letter-spacing: -.01em;
      line-height: 1.3;
      text-align: left;
      padding: 15px 15px 15px 30px;
      border-radius: 999px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform .2s var(--ease), background .2s, box-shadow .2s;
      box-shadow: 0 1px 2px rgba(0,0,0,.35), 0 18px 40px -16px rgba(233,32,99,.7);
    }
    .btn:hover { transform: translateY(-2px); background: #FF2F75; }
    .btn:active { transform: translateY(0); }
    .btn .arr {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: #fff;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform .2s var(--ease);
    }
    .btn:hover .arr { transform: translateX(3px); }
    .btn--light { background: #fff; color: var(--ink-2); box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 16px 40px -14px rgba(255,255,255,.35); }
    .btn--light:hover { background: #FFF0F5; }
    .btn--light .arr { background: var(--accent); color: #fff; }
    .btn--full { width: 100%; text-align: center; }
    .btn--outline {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line-2);
      box-shadow: none;
      padding: 12px 12px 12px 24px;
    }
    .btn--outline:hover { background: rgba(255,255,255,.05); border-color: var(--accent-bright); }
    .btn--outline .arr { background: rgba(37,211,102,.16); color: #3EE07F; }
    .link-arrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      color: #fff;
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,.3);
      padding-bottom: 2px;
      transition: border-color .2s, color .2s;
    }
    .link-arrow:hover { color: var(--accent-bright); border-color: var(--accent-bright); }

    /* ── Cabeçalho ── */
    .site-head {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(7,4,9,.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .head-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      height: 72px;
    }
    .head-logo img { height: 38px; width: auto; }
    .head-nav { display: flex; align-items: center; gap: 4px; }
    .head-nav a {
      font-size: 14px;
      font-weight: 500;
      color: #E9DEE4;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 999px;
      transition: background .2s, color .2s;
    }
    .head-nav a:hover { background: rgba(255,255,255,.07); color: #fff; }
    .head-cta { padding: 11px 11px 11px 20px; font-size: 14px; }
    .head-cta .arr { width: 26px; height: 26px; }

    /* ── Hero ── */
    .hero {
      position: relative;
      z-index: 3;
      background: var(--dark);
      color: var(--body-c);
      padding: 96px 0 128px;
      min-height: 760px;
      display: flex;
      align-items: center;
      overflow: visible;
    }
    .hero-clip { position: absolute; inset: 0; overflow: hidden; }
    .hero-bg { position: absolute; inset: 0; z-index: 0; }
    .hero-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 72% 30%;
      display: block;
      filter: saturate(.6);
    }
    .hero-clip::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(90deg, rgba(7,4,9,.97) 0%, rgba(7,4,9,.82) 40%, rgba(7,4,9,.3) 66%, rgba(7,4,9,.1) 100%),
        linear-gradient(180deg, rgba(233,32,99,.14) 0%, rgba(7,4,9,0) 40%, rgba(7,4,9,.8) 100%);
      pointer-events: none;
    }
    .hero-clip::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 56px 56px;
      -webkit-mask-image: radial-gradient(ellipse 45% 70% at 22% 45%, #000 10%, transparent 75%);
      mask-image: radial-gradient(ellipse 45% 70% at 22% 45%, #000 10%, transparent 75%);
      pointer-events: none;
    }
    .hero-orb {
      position: absolute;
      z-index: 1;
      width: 700px; height: 700px;
      left: -200px; top: 45%;
      transform: translateY(-50%);
      background: radial-gradient(circle, rgba(233,32,99,.22), transparent 60%);
      pointer-events: none;
    }
    .hero > .wrap { position: relative; z-index: 2; width: 100%; }
    .hero-copy { max-width: 640px; }
    .hero-copy .chip { margin-bottom: 28px; }
    .hero h1 {
      font-size: clamp(36px, 5vw, 62px);
      line-height: 1.02;
      letter-spacing: -.04em;
      color: #fff;
      margin: 0 0 22px;
    }
    .hero-sub {
      font-size: 17.5px;
      line-height: 1.7;
      max-width: 560px;
      margin: 0 0 34px;
      color: #DCCFD7;
    }
    .hero-actions { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }

    .hero-tools {
      position: absolute;
      left: 50%;
      bottom: -32px;
      z-index: 6;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px;
      background: rgba(14,8,18,.84);
      border: 1px solid var(--line-2);
      border-radius: 18px;
      box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 30px 60px -20px rgba(0,0,0,.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      white-space: nowrap;
    }
    .hero-tools.rv { transform: translate(-50%, 18px); }
    .hero-tools.rv.in { transform: translate(-50%, 0); }
    .tool {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 16px 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #F3E9EE;
    }
    .tool .ico { color: var(--accent-bright); width: 18px; height: 18px; }
    .tool + .tool { position: relative; }
    .tool + .tool::before {
      content: '';
      position: absolute;
      left: -2px; top: 10px; bottom: 10px;
      width: 1px;
      background: var(--line-2);
    }

    /* ── Seções ── */
    section { padding: 104px 0; position: relative; scroll-margin-top: 72px; }
    #diagnostico { scroll-margin-top: 92px; }
    .band-white { background: var(--paper-2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .band-dark  { background: var(--dark); }
    .sec-head { margin-bottom: 56px; }
    .sec-head.center { text-align: center; }
    .sec-head .chip { margin-bottom: 20px; }
    .sec-head h2 {
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.08;
      letter-spacing: -.035em;
      max-width: 820px;
    }
    .sec-head.center h2 { margin: 0 auto; }
    .sec-head .lead {
      font-size: 16.5px;
      margin-top: 18px;
      max-width: 680px;
    }
    .sec-head.center .lead { margin-left: auto; margin-right: auto; }
    .cta-wrap { text-align: center; margin-top: 52px; }
    .cta-wrap--tight { margin-top: 32px; }
    .closing {
      text-align: center;
      font-size: 17px;
      line-height: 1.7;
      color: var(--ink);
      max-width: 720px;
      margin: 44px auto 0;
    }

    .giant {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 400;
      line-height: .9;
      letter-spacing: -.03em;
      background: linear-gradient(180deg, #FFF1F6 0%, #FF8DB4 48%, rgba(233,32,99,.3) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    /* ── Experiência ── */
    .experiencia { padding-top: 136px; }
    .exp-grid {
      display: grid;
      grid-template-columns: .9fr 1.4fr;
      gap: 18px;
      align-items: stretch;
    }
    .exp-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, var(--surface), var(--paper-2));
      border: 1px solid var(--line);
      border-radius: var(--r-card);
      padding: 34px 30px 30px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 280px;
      box-shadow: var(--shadow-card);
    }
    .exp-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 80% 0%, #000, transparent 70%);
      mask-image: radial-gradient(ellipse 80% 80% at 80% 0%, #000, transparent 70%);
      pointer-events: none;
    }
    .exp-card > * { position: relative; }
    .exp-card .giant { font-size: clamp(96px, 10vw, 150px); margin-bottom: 12px; }
    .exp-card .unit {
      font-family: var(--display);
      font-weight: 700;
      font-size: 24px;
      letter-spacing: -.02em;
      color: var(--ink);
    }
    .exp-card .lbl {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--faint);
      margin-top: 8px;
      line-height: 1.5;
    }
    .joe-card {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-card);
      display: grid;
      grid-template-columns: 220px 1fr;
      box-shadow: var(--shadow-card);
    }
    .joe-card picture { position: relative; }
    .joe-card picture::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(23,15,32,0) 70%, var(--surface) 100%);
    }
    .joe-card img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .joe-card-body { padding: 34px 34px 32px 26px; display: flex; flex-direction: column; justify-content: center; }
    .joe-card h3 {
      font-family: var(--display);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -.03em;
      line-height: 1.05;
      color: #fff;
      margin-bottom: 20px;
    }
    .check-list { list-style: none; display: flex; flex-direction: column; gap: 14px; }
    .check-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 15px;
      line-height: 1.55;
      color: #E9DEE4;
    }
    .check-list .ck-ico { margin-top: 1px; }
    .ck-ico {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--pink-pale);
      color: var(--accent-bright);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ck-ico--warm { background: var(--warm-bg); color: var(--warm); }
    .exp-note {
      text-align: center;
      font-size: 16.5px;
      line-height: 1.75;
      max-width: 720px;
      margin: 0 auto 44px;
    }

    /* ── Cards genéricos (dores · frentes) ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 26px 26px;
      transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s;
      overflow: hidden;
    }
    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 0% 0%, rgba(233,32,99,.16), transparent 55%);
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--pink-line); box-shadow: var(--shadow-card); }
    .card:hover::after { opacity: 1; }
    .card--warm::after { background: radial-gradient(circle at 100% 0%, rgba(255,103,56,.14), transparent 55%); }
    .card--warm:hover { border-color: var(--warm-line); }
    .card .tile { margin-bottom: 20px; }
    .card h3 { font-size: 18px; font-weight: 600; letter-spacing: -.015em; line-height: 1.35; margin-bottom: 9px; }
    .card p { font-size: 14.5px; line-height: 1.62; }
    .tagline {
      text-align: center;
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(28px, 3.4vw, 40px);
      color: #fff;
      margin-top: 48px;
      letter-spacing: -.01em;
    }
    .tagline .em { font-size: 1em; }

    /* ── Etapas · blocos alternados ── */
    .steps { position: relative; display: flex; flex-direction: column; gap: 22px; }
    .step-row {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 22px;
      align-items: stretch;
    }
    .step-row.flip { grid-template-columns: 1.2fr .8fr; }
    .step-row.flip .step-big { order: 2; }
    .step-row.flip .step-card { order: 1; }
    .step-big {
      position: relative;
      overflow: hidden;
      min-height: 300px;
      border-radius: var(--r-card);
      background: linear-gradient(135deg, #241328 0%, #0D0812 100%);
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 32px;
      text-align: center;
      box-shadow: var(--shadow-card);
    }
    .step-big::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 44px 44px;
      -webkit-mask-image: radial-gradient(ellipse 70% 90% at 50% 50%, #000 10%, transparent 75%);
      mask-image: radial-gradient(ellipse 70% 90% at 50% 50%, #000 10%, transparent 75%);
    }
    .step-big::after {
      content: '';
      position: absolute;
      width: 420px; height: 420px;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(233,32,99,.26), transparent 60%);
      pointer-events: none;
    }
    .step-big > * { position: relative; z-index: 1; }
    .step-big .giant { font-size: clamp(110px, 11vw, 160px); }
    .step-big .step-name {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent-bright);
    }
    .step-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-card);
      padding: 36px 36px 34px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: border-color .25s;
    }
    .step-card:hover { border-color: var(--pink-line); }
    .step-card .chip { align-self: flex-start; margin-bottom: 18px; }
    .step-card h3 { font-size: 23px; font-weight: 600; letter-spacing: -.02em; line-height: 1.25; margin-bottom: 12px; }
    .step-card > p { font-size: 15px; line-height: 1.68; margin-bottom: 22px; }
    .deliv-label {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .deliv-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }
    .deliv {
      list-style: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px 16px;
    }
    .deliv li {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 14px;
      line-height: 1.5;
      color: #E9DEE4;
    }
    .deliv .ck-ico { width: 18px; height: 18px; margin-top: 2px; }

    /* ── Da prioridade à rotina ── */
    .shift-list { display: flex; flex-direction: column; gap: 12px; }
    .shift {
      display: grid;
      grid-template-columns: 1fr 56px 1.4fr;
      align-items: center;
      gap: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px 28px;
      transition: border-color .25s, transform .25s var(--ease);
    }
    .shift:hover { border-color: var(--pink-line); transform: translateX(4px); }
    .shift .from {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -.015em;
      line-height: 1.3;
    }
    .shift .to { font-size: 15px; line-height: 1.6; }
    .shift-arrow {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--pink-pale);
      border: 1px solid var(--pink-line);
      color: var(--accent-bright);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      justify-self: center;
    }

    /* ── Para quem ── */
    .fit-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--pink-line);
      border-radius: var(--r-card);
      padding: 40px 40px 36px;
      overflow: hidden;
      max-width: 880px;
      margin: 0 auto;
    }
    .fit-card::before {
      content: '';
      position: absolute;
      inset: 0 0 auto 0;
      height: 260px;
      background: radial-gradient(ellipse 70% 60% at 0% 0%, rgba(233,32,99,.18), transparent 70%);
      pointer-events: none;
    }
    .fit-card > * { position: relative; }
    .fit-card .check-list { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; }
    .fit-note {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px dashed var(--line-2);
      font-size: 15px;
      color: var(--ink);
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .fit-note .ico { color: var(--accent-bright); margin-top: 3px; }

    /* ── Joe ── */
    .band-dark { color: var(--body-c); }
    .author-box {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 56px;
      align-items: center;
    }
    .author-avatar {
      position: relative;
      aspect-ratio: 4 / 5;
      border-radius: 26px;
      background: linear-gradient(180deg, #241328, #0A0710);
      border: 1px solid var(--line-2);
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }
    .author-avatar picture { position: absolute; inset: 0; }
    .author-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .author-avatar::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,4,9,0) 55%, rgba(7,4,9,.88) 100%);
      pointer-events: none;
    }
    .author-badge {
      position: absolute;
      z-index: 2;
      left: 20px; bottom: 20px;
      display: inline-flex;
      align-items: center;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(14,8,18,.8);
      border: 1px solid var(--line-2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .author-badge img { height: 26px; width: auto; }
    .author-info .chip { margin-bottom: 24px; }
    .author-info h2 {
      font-size: clamp(30px, 3.6vw, 44px);
      letter-spacing: -.035em;
      line-height: 1.08;
      color: #fff;
      margin-bottom: 20px;
    }
    .author-info > p { font-size: 15.5px; line-height: 1.75; max-width: 580px; }
    .author-info > p + p { margin-top: 14px; }
    .author-info > p strong { color: #fff; font-weight: 600; }
    .author-info .btn { margin-top: 30px; }

    /* ── Como o trabalho ganha forma ── */
    .proof-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .proof-thumb {
      position: relative;
      margin: 0;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--line-2);
      background: var(--surface);
      box-shadow: var(--shadow-card);
      transition: transform .3s var(--ease), border-color .3s;
    }
    .proof-thumb:hover { transform: translateY(-5px); border-color: var(--pink-line); }
    .proof-thumb img { width: 100%; height: auto; aspect-ratio: 1320 / 900; object-fit: cover; }
    .proof-thumb .chip {
      position: absolute;
      top: 12px; right: 12px;
      padding: 5px 10px 5px 8px;
      font-size: 10px;
      background: rgba(7,4,9,.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* ── FAQ ── */
    .faq-list { display: flex; flex-direction: column; gap: 10px; }
    .faq-item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      transition: border-color .2s, background .2s;
    }
    .faq-item[open] { border-color: var(--pink-line); background: var(--surface-2); }
    .faq-item summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 22px 20px 24px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -.01em;
      color: var(--ink);
    }
    .faq-item summary::-webkit-details-marker { display: none; }
    .faq-item summary .q { flex: 1; }
    .faq-item summary .pm {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--pink-pale);
      border: 1px solid var(--pink-line);
      color: var(--accent-bright);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform .25s var(--ease), background .2s;
    }
    .faq-item[open] summary .pm { transform: rotate(45deg); background: var(--accent); color: #fff; }
    .faq-item .ans { padding: 0 24px 22px 24px; font-size: 15px; line-height: 1.7; max-width: 720px; }

    /* ── Próximo passo · etapas + formulário ── */
    .timeline { max-width: 1040px; margin: 0 auto; }
    .how-label {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .how-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-2), transparent); }
    .tl {
      list-style: none;
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px;
    }
    .tl::before {
      content: '';
      position: absolute;
      left: 26px; right: 26px; top: 25px;
      height: 2px;
      background: linear-gradient(90deg, var(--pink-line), var(--accent) 50%, var(--pink-line));
      box-shadow: 0 0 18px rgba(233,32,99,.45);
    }
    .tl li { position: relative; padding-top: 74px; }
    .tl-node {
      position: absolute;
      top: 0; left: 0;
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--dark);
      border: 1px solid var(--accent);
      box-shadow: 0 0 0 8px rgba(233,32,99,.08), 0 0 28px rgba(233,32,99,.4);
      color: var(--accent-bright);
      font-family: var(--serif);
      font-style: italic;
      font-size: 26px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tl strong { display: block; color: #fff; font-size: 17px; font-weight: 600; letter-spacing: -.015em; line-height: 1.3; margin-bottom: 6px; }
    .tl span:not(.tl-node) { font-size: 14.5px; line-height: 1.6; }

    .form-card {
      --c-ink: #14060D;
      --c-body: #5A4751;
      --c-faint: #8A7A82;
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
      background: linear-gradient(180deg, #FFFFFF 0%, #FBF1F5 100%);
      color: var(--c-body);
      border-radius: 26px;
      padding: 34px;
      box-shadow: 0 2px 6px rgba(0,0,0,.4), 0 50px 90px -30px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.35) inset;
    }
    .form-card .chip { background: rgba(233,32,99,.12); border-color: rgba(233,32,99,.32); color: #C8134F; margin-bottom: 18px; }
    .form-card h3 { color: var(--c-ink); font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: -.028em; line-height: 1.15; margin-bottom: 24px; }
    .form-card h3 .em { color: #C8134F; }
    .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
    .field label { font-size: 13px; font-weight: 600; color: var(--c-ink); letter-spacing: -.005em; }
    .field label .opt { font-weight: 500; color: var(--c-faint); }
    .field input[type="text"], .field input[type="email"], .field input[type="tel"] {
      font-family: var(--sans);
      font-size: 15px;
      color: var(--c-ink);
      background: #fff;
      border: 1px solid rgba(20,6,13,.14);
      border-radius: 12px;
      padding: 13px 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(233,32,99,.14); }
    .field input::placeholder { color: #B5A6AE; }
    .radio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .radio {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      color: var(--c-ink);
      background: rgba(20,6,13,.04);
      border: 1px solid rgba(20,6,13,.08);
      border-radius: 12px;
      padding: 11px 12px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .radio:has(input:checked) { border-color: var(--accent); background: rgba(233,32,99,.08); }
    .radio input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
    .form-card .btn { margin-top: 8px; min-height: 54px; font-size: 16px; }
    .form-legal { font-size: 12.5px; line-height: 1.55; color: var(--c-faint); margin-top: 14px; text-align: center; }
    .form-legal a { color: #C8134F; font-weight: 600; text-decoration: none; }
    .form-success {
      display: none;
      text-align: center;
      padding: 36px 10px;
    }
    .form-success .tile { margin: 0 auto 18px; color: #C8134F; background: rgba(233,32,99,.1); border-color: rgba(233,32,99,.3); }
    .form-success .tile::after { display: none; }
    .form-success strong { display: block; color: var(--c-ink); font-family: var(--display); font-size: 24px; letter-spacing: -.025em; margin-bottom: 10px; }
    .form-success p { font-size: 15.5px; line-height: 1.65; }
    .form-card.is-sent form { display: none; }
    .form-card.is-sent .form-success { display: block; }

    .access-band {
      position: relative;
      margin-top: 72px;
      padding: 72px 0;
      overflow: hidden;
    }
    .marquee {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      gap: 14px;
      padding: 10px 0;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
      pointer-events: none;
      opacity: .75;
    }
    .marquee-row { overflow: hidden; white-space: nowrap; }
    .marquee-track { display: inline-flex; gap: 12px; padding-right: 12px; animation: marquee 46s linear infinite; }
    .marquee-row:nth-child(2) .marquee-track { animation-duration: 58s; animation-direction: reverse; }
    .marquee-row:nth-child(3) .marquee-track { animation-duration: 52s; }
    .marquee-row:nth-child(4) .marquee-track { animation-duration: 64s; animation-direction: reverse; }
    .marquee-row:nth-child(5) .marquee-track { animation-duration: 70s; }
    .marquee-row:nth-child(6) .marquee-track { animation-duration: 56s; animation-direction: reverse; }
    .mq {
      display: inline-flex;
      align-items: center;
      padding: 9px 18px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.025);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,.34);
    }
    @keyframes marquee { to { transform: translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) { .marquee-track { animation: none; } }

    .help-strip {
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px 28px;
      flex-wrap: wrap;
      background: var(--paper-2);
      border: 1px dashed var(--line-2);
      border-radius: 18px;
      padding: 24px 28px;
    }
    .help-strip h3 {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .help-strip h3 .tile { width: 36px; height: 36px; border-radius: 11px; }
    .help-txt { flex: 1 1 320px; }
    .help-txt p { font-size: 14.5px; margin-top: 8px; }
    .help-txt .num { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; font-weight: 600; color: #fff; }
    .help-txt .num .ico { color: #3EE07F; width: 16px; height: 16px; }

    /* ── Rodapé ── */
    footer {
      position: relative;
      padding: 56px 0 40px;
      font-size: 13.5px;
      color: var(--faint);
      border-top: 1px solid var(--line);
    }
    footer::before {
      content: '';
      position: absolute;
      top: -1px; left: 50%;
      width: 360px; height: 1px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, var(--accent-bright), transparent);
    }
    .footer-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr 1fr;
      gap: 32px;
      margin-bottom: 36px;
    }
    .footer-brand img { height: 34px; width: auto; margin-bottom: 14px; }
    .footer-col h4 {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 10px;
    }
    .footer-col a, .footer-col span { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 600; text-decoration: none; }
    .footer-col a:hover { color: var(--accent-bright); }
    .footer-col .ico { width: 16px; height: 16px; color: var(--accent-bright); }
    .footer-bottom {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      font-size: 12.5px;
    }

    /* ── Responsivo ── */
    @media (max-width: 1100px) {
      .author-box { grid-template-columns: 340px 1fr; gap: 40px; }
    }
    @media (max-width: 960px) {
      .head-nav { display: none; }
      .hero {
        display: block;
        min-height: 0;
        padding: 56px 0 72px;
      }
      .hero-bg img { object-position: center 85%; }
      .hero-clip::before {
        background:
          linear-gradient(180deg, rgba(7,4,9,.96) 0%, rgba(7,4,9,.84) 36%, rgba(7,4,9,.2) 50%, rgba(7,4,9,0) 60%, rgba(7,4,9,.15) 74%, rgba(7,4,9,.8) 100%);
      }
      .hero-clip::after { -webkit-mask-image: radial-gradient(ellipse 80% 45% at 30% 20%, #000 10%, transparent 75%); mask-image: radial-gradient(ellipse 80% 45% at 30% 20%, #000 10%, transparent 75%); }
      .hero-tools, .hero-tools.rv, .hero-tools.rv.in {
        position: relative;
        left: auto; bottom: auto;
        transform: none;
        flex-wrap: wrap;
        white-space: normal;
        margin: 28px 24px 0;
        border-radius: 16px;
      }
      .hero-tools.rv { transform: translateY(18px); }
      .hero-tools.rv.in { transform: none; }
      .tool { padding: 9px 12px 9px 10px; font-size: 12.5px; }
      .tool + .tool::before { display: none; }
      .experiencia { padding-top: 96px; }
      .exp-grid { grid-template-columns: 1fr; }
      .joe-card { grid-template-columns: 180px 1fr; }
      .card-grid, .proof-grid { grid-template-columns: 1fr 1fr; }
      .step-row, .step-row.flip { grid-template-columns: 1fr; max-width: 680px; margin: 0 auto; width: 100%; }
      .step-row.flip .step-big { order: 1; }
      .step-row.flip .step-card { order: 2; }
      .step-big { min-height: 220px; }
      .tl { grid-template-columns: 1fr 1fr; gap: 36px 28px; }
      .tl::before { display: none; }
      .author-box { grid-template-columns: 1fr; gap: 36px; }
      .author-avatar { max-width: 420px; }
      .footer-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 720px) {
      section { padding: 72px 0; }
      .hero {
        padding: 44px 0 56px;
        min-height: clamp(1080px, 290vw, 1180px);
        display: flex;
        flex-direction: column;
      }
      .hero > .wrap { flex: 1; display: flex; }
      .hero-copy { display: flex; flex-direction: column; flex: 1; max-width: none; }
      .hero-cta { margin-top: auto; padding-top: 24px; }
      .shift { grid-template-columns: 1fr; gap: 12px; }
      .shift-arrow { justify-self: start; transform: rotate(90deg); width: 36px; height: 36px; }
      .fit-card .check-list { grid-template-columns: 1fr; }
      .fit-card { padding: 30px 24px; }
      .joe-card { grid-template-columns: 1fr; }
      .joe-card picture { aspect-ratio: 4 / 3; }
      .joe-card picture::after { background: linear-gradient(180deg, rgba(23,15,32,0) 60%, var(--surface) 100%); }
      .joe-card-body { padding: 26px 24px 28px; }
      .deliv { grid-template-columns: 1fr; }
      .radio-grid { grid-template-columns: 1fr; }
      .tl { grid-template-columns: 1fr; gap: 30px; }
      .tl::before { display: block; left: 25px; right: auto; top: 26px; bottom: 26px; width: 2px; height: auto; background: linear-gradient(180deg, var(--pink-line), var(--accent) 50%, var(--pink-line)); }
      .tl li { padding: 4px 0 0 72px; min-height: 52px; }
      .help-strip { flex-direction: column; align-items: flex-start; }
      .footer-grid { grid-template-columns: 1fr; gap: 24px; }
      .access-band { margin-top: 48px; padding: 48px 0; }
      .head-cta { padding: 9px 9px 9px 14px; font-size: 11.5px; gap: 8px; white-space: nowrap; }
      .head-cta .arr { width: 22px; height: 22px; }
      .head-logo img { height: 32px; }
    }
    @media (max-width: 560px) {
      .card-grid, .proof-grid { grid-template-columns: 1fr; }
      .exp-card { min-height: 0; padding: 28px 24px 24px; }
      .exp-card .giant { font-size: 86px; }
      .form-card { padding: 26px 20px; border-radius: 22px; }
      .step-card { padding: 28px 24px; }
      .step-big .giant { font-size: 96px; }
      .faq-item summary { padding: 18px 16px 18px 18px; font-size: 15px; }
      .faq-item .ans { padding: 0 18px 20px; }
      .btn { padding-left: 22px; font-size: 15px; }
      .shift { padding: 20px 20px; }
    }
  
    body { min-height: 100vh; display: flex; flex-direction: column; }
    main { flex: 1; display: flex; align-items: center; padding: 80px 0; position: relative; }
    .ty { max-width: 640px; margin: 0 auto; text-align: center; position: relative; z-index: 1; }
    .ty .tile { margin: 0 auto 26px; width: 64px; height: 64px; border-radius: 20px; }
    .ty h1 { font-size: clamp(32px, 5vw, 48px); line-height: 1.08; letter-spacing: -.035em; margin-bottom: 18px; }
